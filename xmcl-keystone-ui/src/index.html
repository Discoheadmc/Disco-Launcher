<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disco Launcher</title>
    <link rel="stylesheet" href="./assets/google.font.css">
    <link rel="stylesheet" href="./assets/preload.css">
    <script src="http://launcher/flights"></script>
    <style>
        /* Disco Launcher: static splash — no pulse animation. */
        .unloaded {
            background-color: rgb(16, 14, 10);
            height: 100vh;
            width: 100vw;
            min-width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
    </style>
</head>

<body class="overflow-hidden unloaded">
    <div id="app">
        <img src="./assets/logo.png" alt="Logo">
    </div>
    <script type="module" src="./windows/main/index.ts"></script>
</body>

</html>
